# tools/mips2c hints, per unit (path relative to the decomp root).
#   asm/x.s:
#     dispatch: [0x8001xxxx, ...]   extra computed-jump targets
#     before: {0x8001xxxx: "C statement;"}   run just before that instruction
#       (not a delay slot); used for optional presentation hooks
#     arena_tags: true               0x8N000000 constants are OT tags XORed with
#                                    arena pointers: MIPS_ARENA_TAG (decisions D25)
asm/renderers/r_cyclorama.s:
  arena_tags: true
asm/renderers/r_shadows.s:
  arena_tags: true
asm/renderers/r_particles.s:
  arena_tags: true

# Widescreen presentation (src/game/present.c, docs/presentation.md): HUD
# models in func_80022A2C project with OFX = their screen x and a fixed
# diag(1, 0.625, 1) matrix; narrow both. Identity while widescreen is off.
asm/renderers/r_moby.s:
  before:
    0x80022D2C: "at = PORT_WS_HUD_OFX(at);"   # ctc2 $at, C2_OFX
    0x80022D78: "a3 = PORT_WS_HUD_R11(a3);"   # ctc2 $a3, C2_R11R12

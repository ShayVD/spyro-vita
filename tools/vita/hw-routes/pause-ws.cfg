# The pause route (D70, D122; stage 7g, D129): the gems script in Artisans to 8,480, then START
# (the pause menu, 8,600), down, down, X (the inventory, 8,740), triangle and START back to
# play; 16:9, a shot every 100 vblanks to 9,100. With virtual vblanks (no REALTIME=1) the shots
# are the same frames every run, so two VPKs' runs can be compared picture for picture.
#   VPK=... PAD=$PWD/tools/vita/hw-routes/pause-ws.pad DEVICE_DEFAULTS=1 \
#     tools/vita/hw_run.sh logs/hw-7g3 1500 @tools/vita/fps-runs/s7g3-pause60.txt @tools/vita/hw-routes/pause-ws.cfg
widescreen=1
shot_every=100
frames=9100

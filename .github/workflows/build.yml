# Build the VPK on pushes to main, tags and pull requests (decisions D57). CI has no
# disc data and no matching build (that needs the user's PsyQ headers), so it
# builds only: the game's layout comes from tools/layout/psx.map. The host
# tests that need disc data or oracle captures skip themselves.
#
# Release: push a tag v* (or run this workflow by hand with draft_release)
# and the two VPKs are attached to a DRAFT GitHub release: spyro-vita.vpk,
# the safe app, and spyro-vita-unsafe.vpk, the same code built with
# -DSPYRO_UNSAFE=ON (decisions D161). Nothing is published: a person reviews
# the draft and publishes it.
name: build

on:
  # main and tags on push, other branches through their pull request (one run
  # per commit, not two)
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      draft_release:
        description: "Attach the VPK to a draft release (tag below)"
        type: boolean
        default: false
      tag:
        description: "Tag for the draft release (e.g. v1.00)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  no-game-data:
    name: No game data in the tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: tools/check_no_assets.sh

  vita:
    name: Vita VPK
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0 # git describe names the build (save states, D51)
      - name: Trust the checkout (git describe runs as root in the container)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Build the VPK
        run: tools/ci/build_vpk.sh build/vita
      - name: The VPK is a safe app
        run: |
          python3 third_party/vita-port-kit/vita/tools/vpk_pack.py show build/vita/spyro-vita.vpk \
            | grep '^eboot safe '
      - uses: actions/upload-artifact@v7
        with:
          name: spyro-vita-vpk
          path: build/vita/spyro-vita.vpk
          if-no-files-found: error
      # The same build's ELF before vita-elf-create, symbols and -g line
      # tables kept: a crash dump (.psp2dmp, e.g. the hang watchdog's, D73)
      # from this run's VPK is read against it (docs/vita-testing.md). The
      # same code and data as eboot.bin, so no game data. CI only: never
      # attached to a release here.
      - uses: actions/upload-artifact@v7
        with:
          name: spyro-vita-elf
          path: build/vita/src/platform/vita/spyro_vita
          if-no-files-found: error

  # The same code as an unsafe app (-DSPYRO_UNSAFE=ON, decisions D157, D161):
  # it also looks for the PlayStation Store copy where the Store installed
  # it, in ux0:pspemu, which a safe app can't open. Built for every run so it
  # keeps building; attached to a release beside the safe VPK.
  vita-unsafe:
    name: Vita VPK (unsafe)
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0 # git describe names the build (save states, D51)
      - name: Trust the checkout (git describe runs as root in the container)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Build the unsafe VPK
        env:
          SPYRO_CMAKE_ARGS: -DSPYRO_UNSAFE=ON
        run: tools/ci/build_vpk.sh build/vita-unsafe
      - name: The VPK is an unsafe app, under its own file name
        run: |
          python3 third_party/vita-port-kit/vita/tools/vpk_pack.py show build/vita-unsafe/spyro-vita.vpk \
            | grep '^eboot unsafe '
          mv build/vita-unsafe/spyro-vita.vpk build/vita-unsafe/spyro-vita-unsafe.vpk
      - uses: actions/upload-artifact@v7
        with:
          name: spyro-vita-unsafe-vpk
          path: build/vita-unsafe/spyro-vita-unsafe.vpk
          if-no-files-found: error
      # This build's ELF, for a crash dump from the unsafe VPK (see the safe
      # job's note). CI only: never attached to a release here.
      - uses: actions/upload-artifact@v7
        with:
          name: spyro-vita-unsafe-elf
          path: build/vita-unsafe/src/platform/vita/spyro_vita
          if-no-files-found: error

  host-tests:
    name: Host build and unit tests (linux32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Build the host image
        run: docker build -t spyro-host -f tools/docker/host.Dockerfile tools/docker
      - name: Build and test
        run: |
          docker run --rm -v "$PWD:/work" -w /work spyro-host sh -ec '
            cmake -S . -B build/linux32 -G Ninja -DSPYRO_HOST=linux32 \
              -DCMAKE_TOOLCHAIN_FILE=cmake/linux32.toolchain.cmake
            cmake --build build/linux32
            ctest --test-dir build/linux32 --output-on-failure'

  # The PC build for Linux (docs/pc-build.md, D240): the amd64 toolchain
  # image, the build, and a start without a disc under a virtual X display
  # (Mesa's llvmpipe): the low image's checks pass, SDL opens a window with a
  # GL 3.3 context, and the game reports the missing disc and exits 1.
  pc-linux:
    name: PC (Linux x86-64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Build the PC image
        run: docker build --platform linux/amd64 -t spyro-pc -f tools/docker/pc.Dockerfile tools/docker
      - name: Build
        run: |
          docker run --rm -v "$PWD:/work" -w /work spyro-pc sh -ec '
            cmake -S . -B build/pc-linux -G Ninja -DSPYRO_HOST=pc \
              -DCMAKE_TOOLCHAIN_FILE=cmake/pc-linux.toolchain.cmake
            cmake --build build/pc-linux'
      - name: Starts, opens a GL 3.3 window, and stops for the missing disc
        run: |
          set +e
          docker run --rm -v "$PWD:/work" -w /work -e HOME=/work/build/pc-home spyro-pc sh -c '
            mkdir -p build/no-disc
            tools/pc/xrun.sh build/pc-linux/spyro --disc build/no-disc --frames 120' > pc-smoke.log 2>&1
          rc=$?
          set -e
          cat pc-smoke.log
          test $rc -eq 1
          grep -q "video: x11, llvmpipe" pc-smoke.log
          grep -q "No Spyro the Dragon disc data was found" pc-smoke.log
      - uses: actions/upload-artifact@v7
        with:
          name: spyro-pc-linux
          path: build/pc-linux/spyro
          if-no-files-found: error

  draft-release:
    name: Draft release
    needs: [no-game-data, vita, vita-unsafe, host-tests]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.draft_release)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: spyro-vita-vpk
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: spyro-vita-unsafe-vpk
          path: dist
      - name: Attach the VPKs to a draft release (never published here)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag }}
        run: |
          [ -n "$TAG" ] || { echo "no tag: push a v* tag or give one" >&2; exit 1; }
          if gh release view "$TAG" >/dev/null 2>&1; then
            [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true ] \
              || { echo "$TAG is already published; not touching it" >&2; exit 1; }
            gh release upload "$TAG" dist/spyro-vita.vpk dist/spyro-vita-unsafe.vpk --clobber
          else
            gh release create "$TAG" dist/spyro-vita.vpk dist/spyro-vita-unsafe.vpk --draft --target "$GITHUB_SHA" \
              --title "Spyro Vita $TAG" \
              --notes "Draft. Built by CI from $GITHUB_SHA. Needs your own disc: see README.md."
          fi

# Build the VPK on pushes to main, tags and pull requests (decisions D57). CI has no
# disc data and no matching build (that needs the user's PsyQ headers), so it
# builds only: the game's layout comes from tools/layout/psx.map. The host
# tests that need disc data or oracle captures skip themselves.
#
# Release: push a tag v* (or run this workflow by hand with draft_release)
# and the two VPKs are attached to a DRAFT GitHub release: spyro-vita.vpk,
# the safe app, and spyro-vita-unsafe.vpk, the same code built with
# -DSPYRO_UNSAFE=ON (decisions D161). Nothing is published: a person reviews
# the draft and publishes it.
name: build

on:
  # main and tags on push, other branches through their pull request (one run
  # per commit, not two)
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      draft_release:
        description: "Attach the VPK to a draft release (tag below)"
        type: boolean
        default: false
      tag:
        description: "Tag for the draft release (e.g. v1.00)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  no-game-data:
    name: No game data in the tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: tools/check_no_assets.sh

  vita:
    name: Vita VPK
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0 # git describe names the build (save states, D51)
      - name: Trust the checkout (git describe runs as root in the container)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Build the VPK
        run: tools/ci/build_vpk.sh build/vita
      - name: The VPK is a safe app
        run: |
          python3 third_party/encore/targets/vita/tools/vpk_pack.py show build/vita/spyro-vita.vpk \
            | grep '^eboot safe '
      - uses: actions/upload-artifact@v7
        with:
          name: spyro-vita-vpk
          path: build/vita/spyro-vita.vpk
          if-no-files-found: error
      # The same build's ELF before vita-elf-create, symbols and -g line
      # tables kept: a crash dump (.psp2dmp, e.g. the hang watchdog's, D73)
      # from this run's VPK is read against it (docs/vita-testing.md). The
      # same code and data as eboot.bin, so no game data. CI only: never
      # attached to a release here.
      - uses: actions/upload-artifact@v7
        with:
          name: spyro-vita-elf
          path: build/vita/src/platform/vita/spyro_vita
          if-no-files-found: error

  # The same code as an unsafe app (-DSPYRO_UNSAFE=ON, decisions D157, D161):
  # it also looks for the PlayStation Store copy where the Store installed
  # it, in ux0:pspemu, which a safe app can't open. Built for every run so it
  # keeps building; attached to a release beside the safe VPK.
  vita-unsafe:
    name: Vita VPK (unsafe)
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0 # git describe names the build (save states, D51)
      - name: Trust the checkout (git describe runs as root in the container)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Build the unsafe VPK
        env:
          SPYRO_CMAKE_ARGS: -DSPYRO_UNSAFE=ON
        run: tools/ci/build_vpk.sh build/vita-unsafe
      - name: The VPK is an unsafe app, under its own file name
        run: |
          python3 third_party/encore/targets/vita/tools/vpk_pack.py show build/vita-unsafe/spyro-vita.vpk \
            | grep '^eboot unsafe '
          mv build/vita-unsafe/spyro-vita.vpk build/vita-unsafe/spyro-vita-unsafe.vpk
      - uses: actions/upload-artifact@v7
        with:
          name: spyro-vita-unsafe-vpk
          path: build/vita-unsafe/spyro-vita-unsafe.vpk
          if-no-files-found: error
      # This build's ELF, for a crash dump from the unsafe VPK (see the safe
      # job's note). CI only: never attached to a release here.
      - uses: actions/upload-artifact@v7
        with:
          name: spyro-vita-unsafe-elf
          path: build/vita-unsafe/src/platform/vita/spyro_vita
          if-no-files-found: error

  host-tests:
    name: Host build and unit tests (linux32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Build the host image
        run: docker build -t spyro-host -f tools/docker/host.Dockerfile tools/docker
      - name: Build and test
        run: |
          docker run --rm -v "$PWD:/work" -w /work spyro-host sh -ec '
            cmake -S . -B build/linux32 -G Ninja -DSPYRO_HOST=linux32 \
              -DCMAKE_TOOLCHAIN_FILE=cmake/linux32.toolchain.cmake
            cmake --build build/linux32
            ctest --test-dir build/linux32 --output-on-failure'

  # The PC build (docs/pc-build.md, D240, D241): the amd64 toolchain image,
  # Linux and Windows (llvm-mingw) from it, and a start of the Linux build
  # without a disc under a virtual X display (Mesa's llvmpipe): the low
  # image's checks pass, SDL opens a window with a GL 3.3 context, and the
  # game reports the missing disc and exits 1.
  pc:
    name: PC (Linux and Windows x86-64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Build the PC image
        run: docker build --platform linux/amd64 -t spyro-pc -f tools/docker/pc.Dockerfile tools/docker
      - name: Build for Linux and Windows
        run: |
          docker run --rm -v "$PWD:/work" -w /work spyro-pc sh -ec '
            cmake -S . -B build/pc-linux -G Ninja -DSPYRO_HOST=pc \
              -DCMAKE_TOOLCHAIN_FILE=cmake/pc-linux.toolchain.cmake
            cmake --build build/pc-linux
            cmake -S . -B build/pc-win -G Ninja -DSPYRO_HOST=pc \
              -DCMAKE_TOOLCHAIN_FILE=cmake/pc-windows.toolchain.cmake
            cmake --build build/pc-win'
      - name: Linux starts, opens a GL 3.3 window, and stops for the missing disc
        run: |
          set +e
          docker run --rm -v "$PWD:/work" -w /work -e HOME=/work/build/pc-home spyro-pc sh -c '
            mkdir -p build/no-disc
            tools/pc/xrun.sh build/pc-linux/spyro --disc build/no-disc --frames 120' > pc-smoke.log 2>&1
          rc=$?
          set -e
          cat pc-smoke.log
          test $rc -eq 1
          grep -q "video: x11, llvmpipe" pc-smoke.log
          grep -q "No Spyro the Dragon disc data was found" pc-smoke.log
      - uses: actions/upload-artifact@v7
        with:
          name: spyro-pc-linux
          path: build/pc-linux/spyro
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: spyro-pc-windows
          path: build/pc-win/spyro.exe
          if-no-files-found: error

  # The Windows build on Windows: it loads at its fixed base, the host's
  # memory (heap, a fresh mapping, a stack) lands below 2 GB as a program
  # that isn't large-address-aware should, SDL opens a window with a GL 3.3 context (Mesa's llvmpipe
  # opengl32.dll beside it: the runner has no GPU), and it stops for the
  # missing disc with exit code 1.
  pc-windows-smoke:
    name: PC (Windows) starts
    needs: pc
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: spyro-pc-windows
          path: run
      - name: Mesa's llvmpipe for GL (mesa-dist-win 26.2.6, MIT)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/pal1000/mesa-dist-win/releases/download/26.2.6/mesa3d-26.2.6-release-mingw.7z -OutFile mesa.7z
          7z x mesa.7z -omesa x64 | Out-Null
          Copy-Item mesa/x64/*.dll run/
      - name: Start without a disc
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force no-disc | Out-Null
          $p = Start-Process -FilePath run/spyro.exe -ArgumentList '--disc','no-disc','--frames','120' `
                 -RedirectStandardError smoke.log -NoNewWindow -PassThru -Wait
          Get-Content smoke.log
          if ($p.ExitCode -ne 1) { throw "exit code $($p.ExitCode), expected 1" }
          if (-not (Select-String -Path smoke.log -Pattern 'all below 2 GB: yes' -Quiet)) { throw "host memory not below 2 GB" }
          if (-not (Select-String -Path smoke.log -Pattern 'video: windows, llvmpipe' -Quiet)) { throw "no GL 3.3 window" }
          if (-not (Select-String -Path smoke.log -Pattern 'No Spyro the Dragon disc data was found' -Quiet)) { throw "no disc message" }

  # The PS4 fpkg as a build check (docs/ps4-build.md, D246): the arm64 OpenOrbis
  # image on an arm64 runner, the test fpkg (SPYT00002) with NO pre-compiled
  # shaders (they are never in the repo, D245): it falls back to the player's
  # Piglet pair or the software renderer. The release fpkg is built on the
  # owner's Mac with tools/ps4/release.sh and attached to the draft release
  # there; this job's pkg is a CI artifact only, never attached to a release.
  ps4:
    name: PS4 fpkg (build check, no shader binaries)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0 # git describe names the build (save states, D51)
      - name: Build the PS4 image
        run: docker build --platform linux/arm64 -t spyro-ps4 -f tools/docker/ps4.Dockerfile tools/docker
      - name: Build the test fpkg
        run: |
          docker run --rm --platform linux/arm64 -v "$PWD:/work" -w /work spyro-ps4 sh -ec '
            git config --global --add safe.directory /work
            cmake -S . -B build/ps4 -G Ninja -DSPYRO_HOST=ps4 \
              -DCMAKE_TOOLCHAIN_FILE=cmake/ps4.toolchain.cmake \
              -DSPYRO_PS4_SHADERS=/work/build/no-shaders
            cmake --build build/ps4' | tee ps4-build.log
          grep -q "shaders_c: 0 pre-compiled shaders" ps4-build.log
          test -s build/ps4/pkg/IV0000-SPYT00002_00-SPYROPS4GAME0000.pkg
      - name: The release check refuses a build without the shader binaries
        run: |
          set +e
          docker run --rm --platform linux/arm64 -v "$PWD:/work" -w /work spyro-ps4 \
            python3 tools/ps4/shader_check.py src/platform/ps4/gpu_gles.c build/no-shaders \
              --cc /usr/lib/llvm-18/bin/clang
          rc=$?
          set -e
          test $rc -eq 1
      - uses: actions/upload-artifact@v7
        with:
          name: spyro-ps4-test-pkg
          path: build/ps4/pkg/IV0000-SPYT00002_00-SPYROPS4GAME0000.pkg
          if-no-files-found: error

  draft-release:
    name: Draft release
    needs: [no-game-data, vita, vita-unsafe, host-tests]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.draft_release)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: spyro-vita-vpk
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: spyro-vita-unsafe-vpk
          path: dist
      - name: Attach the VPKs to a draft release (never published here)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag }}
        run: |
          [ -n "$TAG" ] || { echo "no tag: push a v* tag or give one" >&2; exit 1; }
          if gh release view "$TAG" >/dev/null 2>&1; then
            [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true ] \
              || { echo "$TAG is already published; not touching it" >&2; exit 1; }
            gh release upload "$TAG" dist/spyro-vita.vpk dist/spyro-vita-unsafe.vpk --clobber
          else
            gh release create "$TAG" dist/spyro-vita.vpk dist/spyro-vita-unsafe.vpk --draft --target "$GITHUB_SHA" \
              --title "Spyro Vita $TAG" \
              --notes "Draft. Built by CI from $GITHUB_SHA. Needs your own disc: see README.md."
          fi
